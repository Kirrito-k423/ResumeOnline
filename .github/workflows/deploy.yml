name: Build resume and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile Chinese and English resume PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            resume-zh.tex
            resume-en.tex
          working_directory: latex
          latexmk_use_xelatex: true
          texlive_version: 2026

      - name: Stage PDF downloads
        run: |
          mkdir -p static/files
          cp latex/resume-zh.pdf static/files/resume-zh.pdf
          cp latex/resume-en.pdf static/files/resume-en.pdf

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: false

      - name: Build bilingual website
        run: hugo --minify --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

