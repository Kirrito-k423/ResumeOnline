      label: "Intern-S2 相对 H200 性能提升"
    - value: "2×"
      label: "Intern-S1 Pro 推理性能"
    - value: "3 papers"
      label: "HPCC · DATE · CCF Trans. HPC"
  education:
    - school: "中国科学技术大学"
      degree: "计算机科学与技术（计算机体系结构）· 硕士"
      period: "2021.09 - 2024.06"
    - school: "中国科学技术大学"
      degree: "计算机科学与技术 · 学士"
      period: "2017.09 - 2021.06"
  experience:
    - organization: "华为 · 昇腾产品线训练开发部"
      title: "AI 训练推理框架与异构加速优化工程师"
      period: "2024 下半年 - 至今"
      bullets:
        - "围绕 PyTorch / torch_npu 优化 NPU 训练链路，覆盖细粒度 CPU 绑核、算子 Lazy Init、训练参数寻优与 L2 Cache 利用。"
        - "完成 OpenSoraPlan、DeepSeek-VL2、GLM-4.1V 等多模态模型的 Megatron / FSDP 适配，并参与 DeepSeek-R1、Qwen3 大 EP 推理与 Attention INT8 量化攻关。"
        - "适配 UniVL、verl + Qwen2.5-VL 等多模态 RL 链路；适配 DanceGRPO，将生成模型 RL 分数由 0.4 提升至 0.8。"
        - "通过 GMM 和后处理高效计算，使 Intern-S1 Pro 推理性能翻倍；通过 GDN Triton 算子和框架优化，使 Intern-S2 Preview（Qwen3.5-35B）SFT 由 0.12× 提升至 0.72× H200。"
      links:
        - label: "XTuner + vLLM 技术报告"
          href: "files/xtuner-vllm-rl-architecture-report.pdf"
        - label: "Qwen3.5 优化技术报告"
          href: "files/qwen35-optimization-design.pdf"
    - organization: "华为 2012 实验室"
      title: "暑期实习 · 存内计算 PIM 任务调度研究"
      period: "2023.07 - 2023.09"
      bullets:
        - "构建编译时性能模型，以局部性聚类和连接性聚类减少数据移动。"
        - "结合并行度、访存端口压力等静态特征，在 PIM 与 CPU 间选择更优执行位置。"
        - "仅依赖静态分析获得接近最优的调度结果，避免动态测量开销。"
    - organization: "中国科学技术大学 × 华为"
      title: "鲲鹏 920 基本块吞吐量建模"
      period: "2021.09 - 2022.11"
      bullets:
        - "开发基本块吞吐量预测框架，整理吞吐量、延迟与端口压力等指令描述信息。"
        - "构建覆盖真实应用和评估工具的基准集，并开发运行环境获取准确吞吐量。"
        - "结合鲲鹏 920 微架构改进 llvm-mca 在 AArch64 下的精度，成果发表于 HPCC 2022。"
  projects:
    - title: "Intern-S2 Preview SFT 优化"
      meta: "浦江实验室 · Qwen3.5-35B"
      period: "2026.04 - 2026.06"
      bullets:
        - "定位 GDN 模块占开箱耗时 70%+，消除 causal_conv1d / KKT 路径中的 transpose，并将关键低效 Triton 实现替换或优化为 Ascend C。"
        - "为 GDN 扩展 chunk size 128，优化 solve-tril、KKT、RMSNormGated 与 CV 核同步；通过绑核、去除双机 SP2 通信、融合 RMSNorm 和 CANN 升级完成框架侧优化。"
        - "算子与框架联合优化，使 Intern-S2 Preview（Qwen3.5-35B）SFT 从 0.12× 提升至 0.72× H200。"
      links:
        - label: "阅读 Qwen3.5 优化技术报告（PDF）"
          href: "files/qwen35-optimization-design.pdf"
    - title: "QuEST 多 GPU 量子门电路模拟"
      meta: "ASC20-21 世界大学生超级计算机竞赛"
      period: "2020.11 - 2021.05"
      bullets:
        - "使用 CUDA-aware MPI 直接访问 GPU 显存，并以多 stream 和 buffer 重叠计算与通信。"
        - "用 cuBLAS 替代向量点积与规约操作，在 4 机 8 张 A100 上将规模从 30 拓展至 34 qubits。"
        - "相较 CPU 系统节约 200+ GB 内存，获得决赛一等奖。"
    - title: "大数据串行应用的 CPU 多节点优化"
      meta: "IPCC 2022 ACM 中国-国际并行挑战赛"
      period: "2022.07 - 2022.11"
      bullets:
        - "结合循环展开、手动向量化、OpenMP 与 MPI，实现指令级、节点内和节点间并行。"
        - "优化数据结构、带宽利用和通信量，并以混合精度与 PSRS 等并行算法优化热点。"
        - "在 AMD EPYC 7452 平台实现双节点 10,000×、单节点最高 2,800,000× 加速。"
  awards:
    - name: "中国科学技术大学优秀毕业生"
      result: "2024"
    - name: "ASC20-21 世界大学生超级计算机竞赛"
      result: "决赛一等奖"
    - name: "ISC21 国际大学生超级计算机竞赛"
      result: "决赛一等奖"
    - name: "IPCC 2022 ACM 中国-国际并行挑战赛"
      result: "全国三等奖 · 5/130+"
