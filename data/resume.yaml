  name: "谭邵杰"
  role: "AI 系统 · 昇腾训练推理 · 高性能计算"
  summary: "中国科学技术大学计算机科学与技术硕士，现任华为昇腾训练开发工程师。聚焦 Ascend NPU 上的大模型训练推理框架优化、多模态模型迁移、分布式并行、强化学习与量化加速，并具备计算机体系结构和多节点 CPU/GPU/NPU 优化背景。"
