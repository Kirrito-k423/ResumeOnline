  experience:
    - organization: "Huawei · Ascend Training Development"
      title: "AI Training, Inference & Heterogeneous Acceleration Engineer"
      period: "2024 H2 - Present"
      bullets:
        - "Optimized PyTorch / torch_npu training paths on Ascend NPUs, including fine-grained CPU affinity, operator Lazy Init, parameter tuning, and L2-cache utilization."
        - "Adapted OpenSoraPlan, DeepSeek-VL2, and GLM-4.1V with Megatron / FSDP; contributed to DeepSeek-R1 and Qwen3 large-EP inference and Attention INT8 quantization."
        - "Adapted UniVL and verl + Qwen2.5-VL multimodal RL pipelines; adapted DanceGRPO and raised a generative-model RL score from 0.4 to 0.8."
        - "Doubled Intern-S1 Pro inference through efficient GMM and post-processing computation; optimized GDN Triton kernels and the framework to improve Intern-S2 Preview (Qwen3.5-35B) SFT from 0.12× to 0.72× H200."
      links:
        - label: "XTuner + vLLM Technical Report"
          href: "files/xtuner-vllm-rl-architecture-report.pdf"
        - label: "Qwen3.5 Optimization Report"
          href: "files/qwen35-optimization-design.pdf"
    - organization: "Huawei 2012 Laboratories"
      title: "Research Intern · PIM Task Scheduling"
      period: "Jul 2023 - Sep 2023"
      bullets:
        - "Built a compile-time performance model and reduced data movement through locality and connectivity clustering."
        - "Selected execution between PIM and CPU using static features such as parallelism and memory-port pressure."
        - "Achieved near-optimal scheduling using static analysis alone, eliminating dynamic measurement overhead."
    - organization: "USTC × Huawei"
      title: "Kunpeng 920 Basic-Block Throughput Modeling"
      period: "Sep 2021 - Nov 2022"
      bullets:
        - "Developed a throughput prediction framework using instruction throughput, latency, and port-pressure data."
        - "Built a benchmark suite spanning real applications and evaluation tools, plus a runtime measurement system."
        - "Improved llvm-mca accuracy on AArch64 by modeling Kunpeng 920 microarchitecture; published at HPCC 2022."
  projects:
    - title: "Intern-S2 Preview SFT Optimization"
      meta: "Pujiang Lab · Qwen3.5-35B"
      period: "Apr 2026 - Jun 2026"
      bullets:
        - "Profiled GDN at over 70% of out-of-box runtime, eliminated transpose overhead in causal_conv1d / KKT paths, and replaced or optimized key inefficient Triton implementations with Ascend C."
        - "Added GDN chunk-size 128 support and optimized solve-tril, KKT, RMSNormGated, and CV-core synchronization; tuned CPU affinity, removed two-node SP2 communication, fused RMSNorm, and upgraded CANN."
        - "Combined kernel and framework optimization improved Intern-S2 Preview (Qwen3.5-35B) SFT from 0.12× to 0.72× H200."
      links:
        - label: "Read the Qwen3.5 Optimization Report (PDF)"
          href: "files/qwen35-optimization-design.pdf"
    - title: "Multi-GPU Quantum Circuit Simulation with QuEST"
      meta: "ASC20-21 Student Supercomputer Challenge"
      period: "Nov 2020 - May 2021"
      bullets:
        - "Enabled direct GPU-memory access with CUDA-aware MPI and overlapped computation and communication using streams and buffers."
        - "Replaced vector dot products and reductions with cuBLAS, scaling from 30 to 34 qubits on 8 NVIDIA A100 GPUs across 4 nodes."
        - "Saved more than 200 GB of memory versus the CPU system and won First Prize in the finals."
    - title: "Multi-node CPU Optimization of a Serial Data Application"
      meta: "IPCC 2022 Parallel Computing Challenge"
      period: "Jul 2022 - Nov 2022"
      bullets:
        - "Combined loop unrolling, manual vectorization, OpenMP, and MPI for instruction-, node-, and cluster-level parallelism."
        - "Improved data layout, bandwidth utilization, communication volume, mixed precision, and PSRS-based hotspots."
        - "Reached 10,000× speedup on dual AMD EPYC 7452 nodes and up to 2,800,000× on a single node."
